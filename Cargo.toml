[package]
name = "describe_me"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Décrit rapidement un serveur (CPU, RAM, OS, uptime, services…), pour admins système."
readme = "README.md"
repository = "https://github.com/blastrider/describe_me"
keywords = ["system", "monitoring", "sysinfo", "server"]
categories = ["system", "command-line-utilities"]

[package.metadata]
msrv = "1.90.0"

[package.metadata.deb]
maintainer = "Maxime Guillemin <guimaxali@gmail.com>"
depends = "$auto"
section = "utils"
priority = "optional"
features = ["cli", "web", "config", "systemd", "net", "journald"]
default-features = false
assets = [
    ["target/release/describe-me", "usr/bin/describe-me", "755"],
    ["target/release/describe-me-plugin-certificates", "usr/lib/describe_me/plugins/describe-me-plugin-certificates", "755"],
    ["target/release/describe-me-plugin-containers", "usr/lib/describe_me/plugins/describe-me-plugin-containers", "755"],
    ["packaging/systemd/describe-me.service", "lib/systemd/system/describe-me.service", "644"],
    ["packaging/config/config.toml", "etc/describe_me/config.toml", "644"]
]
maintainer-scripts = "packaging/debian"
conf-files = ["/etc/describe_me/config.toml"]

[lib]
name = "describe_me"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
serde = ["dep:serde", "dep:serde_json", "dep:nix"]
systemd = ["dep:nix"]
cli = ["dep:anyhow", "dep:clap", "serde", "dep:nix", "dep:argon2", "dep:bcrypt", "dep:sha2"]
# pour tests/fuzz uniquement; n'active rien en prod
internals = []
config = ["serde", "dep:toml", "dep:roxmltree"]
net = []
web = ["dep:tokio", "dep:axum", "dep:tokio-stream", "serde", "dep:argon2", "dep:bcrypt", "dep:axum-server", "dep:serde_urlencoded", "dep:rustls", "dep:tokio-rustls", "dep:pem", "dep:base64", "dep:percent-encoding", "dep:sha2", "dep:futures-util", "dep:pin-project", "dep:tower",]
journald = ["dep:tracing-journald"]  

[dependencies]
thiserror = "1.0"
sysinfo = { version = "0.30", default-features = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }
toml = { version = "0.8", optional = true }
axum = { version = "0.7", optional = true }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal"], optional = true }
tokio-stream = { version = "0.1", optional = true }   
argon2 = { version = "0.5", features = ["password-hash"], optional = true }
bcrypt = { version = "0.15", optional = true }
bitflags = "2.6"
rand_core = { version = "0.6", features = ["getrandom"] }
nix = { version = "0.29", default-features = false, features = ["user", "signal", "process"], optional = true }
tracing = "0.1"
fastrand = "2.0"
futures-util = { version = "0.3", optional = true }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }   # <— NEW
tracing-journald = { version = "0.3", optional = true }    
pin-project = { version = "1.1", optional = true }
percent-encoding = { version = "2.3", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
base64 = { version = "0.22", optional = true }
tower = { version = "0.4", optional = true }
hex = "0.4"
sha2 = { version = "0.10", optional = true }
tempfile = "3.10"
roxmltree = { version = "0.20", optional = true }
axum-server = { version = "0.7.3", default-features = false, optional = true }
redb = "1.5"
describe_me_plugin_sdk = { version = "0.1.0", path = "describe_me_plugin_sdk" }
wait-timeout = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12", "aws-lc-rs"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging", "tls12"], optional = true }
pem = { version = "3.0", optional = true }

[dev-dependencies]
proptest = "1.5"
criterion = "0.5"
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time"] }

[[bin]]
name = "describe-me"
path = "src/bin/describe-me.rs"
required-features = ["cli"]

[[bin]]
name = "describe-me-plugin-containers"
path = "src/bin/describe-me-plugin-containers.rs"
required-features = ["serde"]
