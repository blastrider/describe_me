<div class="filters-panel" id="socketsFilters" hidden>
  <label class="sr-only" for="socketsSearch">Rechercher un port ou un tag</label>
  <input
    type="search"
    id="socketsSearch"
    class="filter-input"
    placeholder="Rechercher un port ou un tag" />
  <div class="filter-tags" id="socketsTags"></div>
</div>
<div class="pagination-controls" id="socketsPagination" hidden>
  <button type="button" class="link-button small" id="socketsPrev">Page précédente</button>
  <span class="pagination-info" id="socketsPageInfo">—</span>
  <button type="button" class="link-button small" id="socketsNext">Page suivante</button>
</div>
<div class="grid" id="socketsGrid" hidden data-draggable-zone>
  <section class="card" id="socketsTcpCard">
    <h2>Ports TCP en écoute</h2>
    <div class="services-list" id="socketsTcp">
      <div class="service-empty">—</div>
    </div>
  </section>
  <section class="card" id="socketsUdpCard">
    <h2>Ports UDP en écoute</h2>
    <div class="services-list" id="socketsUdp">
      <div class="service-empty">—</div>
    </div>
  </section>
</div>
<div class="service-empty" id="socketsNotExposed" hidden>Sockets non exposées</div>
